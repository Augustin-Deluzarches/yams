<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Score Yams</title>
  <style>
    :root{
      --accent: #7CFF4D;
      --border-green: var(--accent);
      --border-black: #000;
      --bg: #fff;
      --calc-bg: #f4f4f5;
    }

    body{
      font-family: system-ui, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
    }

    /* Top bar */
    .top-left{
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button.btn{
      height: 40px;
      font-size: 16px;
      border-radius: 6px;
      border: 2px solid #000;
      background: #fff;
      padding: 6px 12px;
      cursor: pointer;
    }

    select.menu{
      height: 40px;
      font-size: 16px;
      border-radius: 6px;
      border: 2px solid #000;
      background: #fff;
      padding: 6px 10px;
    }

    /* Layout principal centré */
    .page{
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 70px 16px 24px; /* laisse la place à la topbar */
      box-sizing: border-box;
    }

    .hidden{ display: none !important; }

    /* Tableau multi-joueurs */
    .board{
      display: grid;
      row-gap: 10px;
      column-gap: 14px;
      align-items: center;
    }

    .header-btn{
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .header-btn:focus{
      outline: 2px solid #000;
      outline-offset: 2px;
    }

    .label{
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      user-select: none;
      white-space: nowrap;
    }

    .header{
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin: 0;
      white-space: nowrap;
    }



    /* Cases */
    select.score, input.readonly{
      width: 110px;
      height: 42px;
      font-size: 18px;
      text-align: center;

      border-radius: 4px;
      border: 2px solid var(--border-green);
      background: #fff;
      outline: none;
      appearance: auto;
      justify-self: center;
      box-sizing: border-box;
    }

    select.score.filled{ border-color: var(--border-black); }

    input.readonly{
      border-color: var(--border-black);
    }

    input.readonly:disabled{
      color: #111;
      background: var(--calc-bg);
      opacity: 1;
    }

    select.score:focus{
      box-shadow: 0 0 0 3px rgba(124, 255, 77, 0.35);
    }

    /* Classement final */
    #ranking{
      margin-top: 18px;
      border: 2px solid #000;
      border-radius: 10px;
      padding: 12px 14px;
      max-width: 520px;
      width: 100%;
      background: #fff;
      box-sizing: border-box;
    }

    #ranking h2{
      margin: 0 0 8px 0;
      font-size: 18px;
    }

    #ranking .row{
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-top: 1px solid #ddd;
      font-size: 16px;
    }

    #ranking .row:first-of-type{
      border-top: none;
    }

    #ranking .name{ font-weight: 700; }
    #ranking .score{ font-variant-numeric: tabular-nums; }

    #splashImage{
      max-width: min(520px, 80vw);
      max-height: 60vh;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>

  <div class="top-left">
    <button id="addPlayerBtn" class="btn">Ajouter joueur</button>

    <!-- caché tant qu'il n'y a aucun joueur -->
    <select id="rulesMenu" class="menu hidden" aria-label="Règles">
      <option value="delta" selected>Delta</option>
      <option value="chance">Chance</option>
    </select>
  </div>

  <div class="page">
    <img id="splashImage" src="gildas.png" alt="Gildas" />

    <!-- caché tant qu'il n'y a aucun joueur -->
    <div id="board" class="board hidden" aria-live="polite"></div>
    <div id="ranking" class="hidden" aria-live="polite"></div>
  </div>

  <script>
    // ---------------------------
    // Config des lignes (labels)
    // ---------------------------
    const ROWS = [
      { key: "as", label: "As", type: "upper" },
      { key: "deux", label: "Deux", type: "upper" },
      { key: "troix", label: "Troix", type: "upper" },
      { key: "quatre", label: "Quatre", type: "upper" },
      { key: "cinq", label: "Cinq", type: "upper" },
      { key: "six", label: "Six", type: "upper" },

      { key: "total_points", label: "Total des points", type: "calc" },
      { key: "bonus", label: "Bonus", type: "calc" },
      { key: "upper_total", label: "Total partie supérieure", type: "calc" },

      { key: "brelan", label: "Brelan", type: "lower" },
      { key: "carre", label: "Carré", type: "lower" },
      { key: "full", label: "Full", type: "lower" },
      { key: "petite_suite", label: "Petite suite", type: "lower" },
      { key: "grande_suite", label: "Grande suite", type: "lower" },
      { key: "yams", label: "Yams", type: "lower" },

      // Bloc Delta (visible si rulesMode === "delta")
      { key: "min", label: "Min", type: "delta" },
      { key: "max", label: "Max", type: "delta" },
      { key: "delta", label: "Delta", type: "calc_delta" },

      // Bloc Chance (visible si rulesMode === "chance")
      { key: "chance", label: "Chance", type: "chance" },

      { key: "lower_total", label: "Total partie inférieur", type: "calc" },
      { key: "total", label: "Total", type: "calc" },
    ];

    // ---------------------------
    // Helpers
    // ---------------------------
    const board = document.getElementById("board");
    const rankingEl = document.getElementById("ranking");
    const addPlayerBtn = document.getElementById("addPlayerBtn");
    const rulesMenu = document.getElementById("rulesMenu");
    const splashImage = document.getElementById("splashImage");

    let rulesMode = "delta"; // "delta" | "chance"
    const players = [];      // { name, els: {...} }

    function range(min, max){
      const a = [];
      for(let i=min;i<=max;i++) a.push(i);
      return a;
    }

    function makeLabelCell(text){
      const d = document.createElement("div");
      d.className = "label";
      d.textContent = text;
      return d;
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    function makeHeaderCell(player){
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "header header-btn";
      btn.textContent = player.name;
      btn.title = "Cliquer pour supprimer ce joueur";

      btn.addEventListener("click", () => {
        const ok = confirm(`Supprimer le joueur "${player.name}" ?`);
        if (!ok) return;

        const idx = players.indexOf(player);
        if (idx >= 0) players.splice(idx, 1);

        rebuildBoard();
        updateAllPlayers();
        updateRankingVisibility();
      });

      return btn;
    }

    function makeSelect(values, defaultValue = 0){
      const sel = document.createElement("select");
      sel.className = "score";
      for (const v of values){
        const opt = document.createElement("option");
        opt.value = String(v);
        opt.textContent = String(v);
        if (v === defaultValue) opt.selected = true;
        sel.appendChild(opt);
      }
      return sel;
    }

    function makeSelectWithEmpty(values, emptyLabel = "—"){
      const sel = document.createElement("select");
      sel.className = "score";
      const empty = document.createElement("option");
      empty.value = "";
      empty.textContent = emptyLabel;
      empty.selected = true;
      sel.appendChild(empty);

      for (const v of values){
        const opt = document.createElement("option");
        opt.value = String(v);
        opt.textContent = String(v);
        sel.appendChild(opt);
      }
      return sel;
    }

    function makeReadonlyInput(initial="0"){
      const input = document.createElement("input");
      input.className = "readonly";
      input.type = "text";
      input.value = initial;
      input.disabled = true;
      return input;
    }

    // "rempli" dès que ce n'est pas vide
    function isFilledSelect(sel){
      return sel.value !== "";
    }

    function updateFilledClassForPlayer(p){
      const selects = [
        p.els.as, p.els.deux, p.els.troix, p.els.quatre, p.els.cinq, p.els.six,
        p.els.brelan, p.els.carre, p.els.full, p.els.petite_suite, p.els.grande_suite, p.els.yams,
        p.els.min, p.els.max, p.els.chance
      ].filter(Boolean);

      for (const sel of selects){
        sel.classList.toggle("filled", isFilledSelect(sel));
      }
    }

    // ---------------------------
    // Classement final
    // ---------------------------
    function allFieldsCompleted(){
      if (players.length === 0) return false;

      for (const p of players){
        const selects = [
          p.els.as, p.els.deux, p.els.troix, p.els.quatre, p.els.cinq, p.els.six,
          p.els.brelan, p.els.carre, p.els.full, p.els.petite_suite, p.els.grande_suite, p.els.yams
        ];

        if (rulesMode === "delta"){
          selects.push(p.els.min, p.els.max);
        } else {
          selects.push(p.els.chance);
        }

        for (const sel of selects){
          if (!sel) continue;
          if (sel.value === "") return false;
        }
      }
      return true;
    }

    function renderRanking(){
      const items = players.map(p => ({
        name: p.name,
        total: Number(p.els.total.value) || 0
      }));

      items.sort((a,b) => b.total - a.total);

      rankingEl.innerHTML = `
        <h2>Classement final</h2>
        ${items.map((it, idx) => `
          <div class="row">
            <div class="name">${idx+1}. ${escapeHtml(it.name)}</div>
            <div class="score">${it.total}</div>
          </div>
        `).join("")}
      `;
    }

    function updateRankingVisibility(){
      const done = allFieldsCompleted();
      rankingEl.classList.toggle("hidden", !done);
      if (done) renderRanking();
    }

    // ---------------------------
    // Calculs (par joueur)
    // ---------------------------
    function computeBonus(totalPoints){
      let bonus = -63 + totalPoints;
      if (bonus >= 0) bonus = 35;
      return bonus;
    }

    function computeUpperTotal(totalPoints, bonus){
      // bonus ajouté seulement si bonus >= 0
      const upperTotalRaw = (bonus >= 0) ? (totalPoints + bonus) : totalPoints;
      return Math.max(0, upperTotalRaw);
    }

    function computeDeltaForPlayer(p){
      const asVal = Number(p.els.as.value) || 0;

      if (p.els.min.value === "" || p.els.max.value === "") return 0;

      const minVal = Number(p.els.min.value);
      const maxVal = Number(p.els.max.value);

      if (maxVal < minVal) return 0;

      return (maxVal - minVal) * asVal;
    }

    function computeLowerBaseForPlayer(p){
      const brelan = Number(p.els.brelan.value) || 0;
      const carre = Number(p.els.carre.value) || 0;
      const full = Number(p.els.full.value) || 0;
      const petite = Number(p.els.petite_suite.value) || 0;
      const grande = Number(p.els.grande_suite.value) || 0;
      const yams = Number(p.els.yams.value) || 0;
      return brelan + carre + full + petite + grande + yams;
    }

    function updateComputedForPlayer(p){
      const totalPoints =
        (Number(p.els.as.value) || 0) +
        (Number(p.els.deux.value) || 0) +
        (Number(p.els.troix.value) || 0) +
        (Number(p.els.quatre.value) || 0) +
        (Number(p.els.cinq.value) || 0) +
        (Number(p.els.six.value) || 0);

      const bonus = computeBonus(totalPoints);
      const upperTotal = computeUpperTotal(totalPoints, bonus);

      p.els.total_points.value = String(totalPoints);
      p.els.bonus.value = String(bonus);
      p.els.upper_total.value = String(upperTotal);

      const lowerBase = computeLowerBaseForPlayer(p);

      let extra = 0;
      if (rulesMode === "delta"){
        const delta = computeDeltaForPlayer(p);
        p.els.delta.value = String(delta);
        extra = delta;
      } else {
        extra = Number(p.els.chance.value) || 0;
      }

      const lowerTotal = lowerBase + extra;
      p.els.lower_total.value = String(lowerTotal);

      const total = lowerTotal + upperTotal;
      p.els.total.value = String(total);

      updateFilledClassForPlayer(p);
      updateRankingVisibility();
    }

    function updateAllPlayers(){
      for (const p of players) updateComputedForPlayer(p);
    }

    // ---------------------------
    // Render board (rebuild)
    // ---------------------------
    function rebuildBoard(){
      const hasPlayers = players.length > 0;

      splashImage.classList.toggle("hidden", hasPlayers);

      board.classList.toggle("hidden", !hasPlayers);
      rulesMenu.classList.toggle("hidden", !hasPlayers);

      board.innerHTML = "";

      if (!hasPlayers) return;

      const labelColWidth = 180;
      const playerColWidth = 140;
      board.style.gridTemplateColumns = `${labelColWidth}px repeat(${players.length}, ${playerColWidth}px)`;

      // header
      board.appendChild(document.createElement("div"));
      for (const p of players){
        board.appendChild(makeHeaderCell(p));
      }

      // rows
      for (const row of ROWS){
        const hiddenByMode =
          (row.type === "delta" || row.type === "calc_delta") ? (rulesMode !== "delta") :
          (row.type === "chance") ? (rulesMode !== "chance") :
          false;

        if (hiddenByMode) continue;

        board.appendChild(makeLabelCell(row.label));
        for (const p of players){
          board.appendChild(p.els[row.key]);
        }
      }
    }

    // ---------------------------
    // Create player column
    // ---------------------------
    function createPlayer(name){
      const p = { name, els: {} };

      // Upper selects: 0..5*n (avec option vide au départ)
      const makeUpperSelect = (n) => {
        const values = [];
        for (let k=0;k<=5;k++) values.push(n*k);
        const sel = makeSelectWithEmpty(values); // "—" par défaut
        sel.addEventListener("change", () => updateComputedForPlayer(p));
        return sel;
      };

      p.els.as = makeUpperSelect(1);
      p.els.deux = makeUpperSelect(2);
      p.els.troix = makeUpperSelect(3);
      p.els.quatre = makeUpperSelect(4);
      p.els.cinq = makeUpperSelect(5);
      p.els.six = makeUpperSelect(6);

      // Calculés upper
      p.els.total_points = makeReadonlyInput("0");
      p.els.bonus = makeReadonlyInput("-63");
      p.els.upper_total = makeReadonlyInput("0");

      // Lower selects (option vide au départ)
      p.els.brelan = makeSelectWithEmpty(range(0,30)); p.els.brelan.addEventListener("change", () => updateComputedForPlayer(p));
      p.els.carre = makeSelectWithEmpty(range(0,30)); p.els.carre.addEventListener("change", () => updateComputedForPlayer(p));
      p.els.full = makeSelectWithEmpty([0,25]); p.els.full.addEventListener("change", () => updateComputedForPlayer(p));
      p.els.petite_suite = makeSelectWithEmpty([0,15]); p.els.petite_suite.addEventListener("change", () => updateComputedForPlayer(p));
      p.els.grande_suite = makeSelectWithEmpty([0,30]); p.els.grande_suite.addEventListener("change", () => updateComputedForPlayer(p));
      p.els.yams = makeSelectWithEmpty([0,50]); p.els.yams.addEventListener("change", () => updateComputedForPlayer(p));

      // Delta mode fields
      p.els.min = makeSelectWithEmpty(range(5,30)); p.els.min.addEventListener("change", () => updateComputedForPlayer(p));
      p.els.max = makeSelectWithEmpty(range(5,30)); p.els.max.addEventListener("change", () => updateComputedForPlayer(p));
      p.els.delta = makeReadonlyInput("0");

      // Chance mode field
      p.els.chance = makeSelectWithEmpty(range(0,30)); p.els.chance.addEventListener("change", () => updateComputedForPlayer(p));

      // Totaux
      p.els.lower_total = makeReadonlyInput("0");
      p.els.total = makeReadonlyInput("0");

      updateFilledClassForPlayer(p);
      return p;
    }

    // ---------------------------
    // Events
    // ---------------------------
    addPlayerBtn.addEventListener("click", () => {
      const name = prompt("Nom du joueur :");
      if (!name) return;

      const trimmed = name.trim();
      if (!trimmed) return;

      players.push(createPlayer(trimmed));
      rebuildBoard();
      updateAllPlayers();
      updateRankingVisibility();
    });

    rulesMenu.addEventListener("change", (e) => {
      rulesMode = e.target.value;
      rebuildBoard();
      updateAllPlayers();
      updateRankingVisibility();
    });

    // Initial state: only "Ajouter joueur" visible (rules + board hidden)
  </script>

</body>
</html>
